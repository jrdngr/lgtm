[package]
name = "lgtm-arch"
version = "0.1.0"
description = "lgtm's architecture review: components, their imports, and an agent's assessments, system descriptions, tours and designs"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
futures = "0.3"
ignore = "0.4.33"
lgtm-canvas = { path = "../lgtm-canvas" }
lgtm-core = { path = "../lgtm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "1", features = ["process", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
toml = "1.1.8"
tree-sitter = "0.27"

[dev-dependencies]
tempfile = "3"
