[package]
name = "lgtm"
version = "0.1.0"
description = "Desktop code review for agentic development"
edition = "2024"

[lib]
name = "lgtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
anyhow = "1"
blake3 = "1"
tokio = { version = "1", features = ["process", "sync", "macros", "rt-multi-thread", "time", "net", "io-util", "io-std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
similar = "3"
futures = "0.3"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-swift = "0.7"
toml = "1.1.8"
globset = "0.4.20"
notify = "8.2.0"
ignore = "0.4.33"
rmcp = "3.5.1"
tree-sitter-md = "0.5.3"
tree-sitter-css = "0.25.0"
tree-sitter-scss = "1.0.0"
tree-sitter-html = "0.23.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-containerfile = "0.9.2"
tree-sitter-make = "1.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
