[package]
name = "lgtm-core"
version = "0.1.0"
description = "What lgtm's desktop and terminal apps share"
edition = "2024"
license = "MIT"

[features]
# jj test helpers for other crates' tests.
test-support = ["dep:tempfile"]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
globset = "0.4.20"
ignore = "0.4.33"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tempfile = { version = "3", optional = true }
toml = "1.1.8"
tokio = { version = "1", features = ["process", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
tracing = "0.1"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-md = "0.5.3"
tree-sitter-css = "0.25.0"
tree-sitter-scss = "1.0.0"
tree-sitter-html = "0.23.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-containerfile = "0.9.2"
tree-sitter-make = "1.1.1"
tree-sitter-hcl = "1.1.0"
codebook-tree-sitter-just = "0.1.3"

[dev-dependencies]
tempfile = "3"
