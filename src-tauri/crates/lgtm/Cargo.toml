[package]
name = "lgtm"
version = "0.1.0"
description = "Terminal code review for jj"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
lgtm-core = { path = "../lgtm-core" }
ignore = "0.4.33"
notify = "8.2.0"
ropey = "1.6"
similar = "3"
ratatui = "0.30"
rmcp = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"
lgtm-core = { path = "../lgtm-core", features = ["test-support"] }
